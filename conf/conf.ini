[login_server]
host = 127.0.0.1
port = 8003

[mysql]
host = 127.0.0.1
port = 3306
user = root
password = 123456
dbname = mssg
max_open = 100
max_idle = 10
max_lifetime = 300

[log]
level = debug
format = text
#output = e:/mssgServer/logs/app.log
#output = console
output = dual:e:/mssgServer/logs/app.log
# 轮转配置
max_size = 100mb      # 单个日志文件最大，支持 kb/mb/gb，纯数字当作字节
max_backups = 7        # 保留最近 N 天的旧日志文件，超过自动删除