[gateway]
# Gateway 自身的 HTTP 监听地址（客户端和后端都访问这个）
host = 0.0.0.0
port = 9000
# 路由策略: round_robin / least_conn / uid_hash
policy = round_robin

[login_server]
host = 127.0.0.1
port = 8003

[chat_server]
host = 127.0.0.1
port = 8004

[mysql]
host = mysql.rds.aliyuncs.com
port = 3306
user = xxxx
password = xxxxxxx
dbname = mssg
max_open = 300
max_idle = 50
max_lifetime = 300

[redis]
# Redis 是可选的：不配或连不上也能跑，只是没有跨节点功能和缓存
host = 127.0.0.1
port = 6379
password =
db = 0

[log]
level = debug
format = text
#output = e:/mssgServer/logs/app.log
#output = console
output = dual:e:/mssgServer/logs/app.log
# 轮转配置
max_size = 100mb      # 单个日志文件最大，支持 kb/mb/gb，纯数字当作字节
max_backups = 7        # 保留最近 N 天的旧日志文件，超过自动删除