[gateway]
# Gateway 自身的 HTTP 监听地址（客户端和后端都访问这个）
host = 0.0.0.0
port = 9000
# 路由策略: round_robin / least_conn / uid_hash
policy = round_robin

[login_server]
host = 127.0.0.1
port = 8003

[ws_server]
# WebSocket 长连接配置
# 单进程最大并发连接数（默认 20000，建议根据服务器配置调优）
# 阿里云 4核8G 建议 20000；8核16G 建议 50000
max_conns = 20000

[chat_server]
host = 127.0.0.1
port = 8004

[room_server]
host = 127.0.0.1
port = 8005

[mysql]
host = rm-bp1x9dgg1472emd223o.mysql.rds.aliyuncs.com
port = 3306
user = mssg_user
password = Mima123456
dbname = mssg
max_open = 800
max_idle = 50
max_lifetime = 300

[mysql_log]
# 日志库（独立库，存 item_op_log / chat_log 等只写不改的表）
host = rm-bp1x9dgg1472emd223o.mysql.rds.aliyuncs.com
port = 3306
user = mssg_user
password = Mima123456
dbname = game_log
max_open = 100
max_idle = 20
max_lifetime = 300

[redis]
# Redis 是可选的：不配或连不上也能跑，只是没有跨节点功能和缓存
host = 127.0.0.1
port = 6379
password =
db = 0

[log]
level = debug
format = text
#output = e:/mssgServer/logs/app.log
#output = console
output = dual:e:/mssgServer/logs/app.log
# 轮转配置
max_size = 100mb      # 单个日志文件最大，支持 kb/mb/gb，纯数字当作字节
max_backups = 7        # 保留最近 N 天的旧日志文件，超过自动删除


[api_server]
host = 127.0.0.1
port = 8006

[broker]
# Broker 自身的 WS 代理监听地址（范式 B 两阶段连接的第二阶段）
# ⚠️ host 不能用 0.0.0.0！因为会注册到 Gateway 并通过 dispatch 返回给客户端
#    0.0.0.0 是监听地址，不是客户端可连接的地址
#    生产环境多网卡机器改成具体 IP（如 192.168.x.x）
host = 127.0.0.1
port = 9001
# Gateway 地址（Broker 启动时向 Gateway 注册，运行时通过 HTTP 拿后端节点地址）
gateway_url = http://127.0.0.1:9000